services:
  - type: web
    name: dt1-tms
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    # SQLite database + uploads live on this persistent disk (DATA_DIR). Render snapshots it daily.
    disk:
      name: disk
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      # Shared secret for GET /admin/backup (nightly OneDrive backup). Set in the dashboard.
      - key: BACKUP_TOKEN
        sync: false
      # Logan (Grok Bot) load-created webhook. POST JSON with Authorization: Bearer <key>.
      # Set both in the dashboard. Unset = no webhook. sync: false is not copied into previews.
      - key: LOGAN_WEBHOOK_URL
        sync: false
      - key: LOGAN_WEBHOOK_KEY
        sync: false
      # Bearer token for /api/logan (min 32 characters). Unset = those routes are 404.
      - key: LOGAN_API_TOKEN
        sync: false
      # Quo (formerly OpenPhone) inbound text relay: POST /webhooks/quo/message-received
      # verifies the signature, then POSTs a short summary to Logan with
      # Authorization: Bearer <LOGAN_QUO_WEBHOOK_KEY>. Set these in the dashboard.
      # QUO_DT1_PHONE_NUMBER is optional; unset forwards every message.received.
      # sync: false is not copied into preview environments.
      - key: QUO_WEBHOOK_SECRET
        sync: false
      - key: LOGAN_QUO_WEBHOOK_URL
        sync: false
      - key: LOGAN_QUO_WEBHOOK_KEY
        sync: false
      - key: QUO_DT1_PHONE_NUMBER
        sync: false
